openapi: 3.0.3
info:
  title: API
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    CreateOrgRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    InviteMemberRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string

    DocumentRequest:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
        content:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

paths:

  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Sign up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '201':
          description: User created
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Login successful
        '400':
          description: Invalid request
        '401':
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get user details (self only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User retrieved
        '401':
          description: Missing or invalid token
        '403':
          description: Cannot access other users
        '404':
          description: User not found

  /api/orgs:
    post:
      tags: [Organizations]
      summary: Create organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgRequest'
      responses:
        '201':
          description: Organization created (creator becomes owner)
        '400':
          description: Invalid request
        '401':
          description: Unauthorized

  /api/orgs/{orgId}:
    get:
      tags: [Organizations]
      summary: Get organization details (members only)
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Organization details
        '401':
          description: Unauthorized
        '403':
          description: Not a member of this organization
        '404':
          description: Organization not found

  /api/orgs/{orgId}/invite:
    post:
      tags: [Organizations]
      summary: Invite user to organization (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
      responses:
        '201':
          description: User invited
        '400':
          description: User already a member
        '401':
          description: Unauthorized
        '403':
          description: Not authorized (not owner)
        '404':
          description: User not found

  /api/orgs/{orgId}/{username}:
    delete:
      tags: [Organizations]
      summary: Remove member from organization (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Member removed
        '401':
          description: Unauthorized
        '403':
          description: Not authorized (not owner)
        '404':
          description: User not found in org
        '500':
          description: Failed to remove member

  /api/orgs/{orgId}/documents:
    get:
      tags: [Documents]
      summary: Get all documents (members only)
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of documents
        '401':
          description: Unauthorized
        '403':
          description: Not a member of this org
        '404':
          description: Organization not found

    post:
      tags: [Documents]
      summary: Create document (members only)
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
      responses:
        '201':
          description: Document created
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Not a member of this org

  /api/orgs/{orgId}/documents/{id}:
    get:
      tags: [Documents]
      summary: Get document (members only)
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Document
        '401':
          description: Unauthorized
        '403':
          description: Not a member of this org
        '404':
          description: Document not found

    patch:
      tags: [Documents]
      summary: Update document (members only)
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
      responses:
        '200':
          description: Document updated
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Not a member of this org
        '404':
          description: Document not found

    delete:
      tags: [Documents]
      summary: Delete document (members only)
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Document deleted
        '401':
          description: Unauthorized
        '403':
          description: Not a member of this org
        '404':
          description: Document not found
        '500':
          description: Server error
